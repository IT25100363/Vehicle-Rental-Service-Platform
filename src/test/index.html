<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveSync - Premium Vehicle Service Platform</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
<div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="ph-fill ph-car-profile logo-icon"></i>
            <h2>DriveSync</h2>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav">
            <a href="#" class="nav-item active" data-target="users">
                <i class="ph ph-users"></i> User Management
            </a>
            <a href="#" class="nav-item" data-target="vehicles">
                <i class="ph ph-car"></i> Vehicle Management
            </a>
            <a href="#" class="nav-item" data-target="bookings">
                <i class="ph ph-calendar-check"></i> Booking Management
            </a>
            <a href="#" class="nav-item" data-target="payments">
                <i class="ph ph-credit-card"></i> Payment Management
            </a>
            <a href="#" class="nav-item" data-target="admins">
                <i class="ph ph-shield-check"></i> Admin Management
            </a>
            <a href="#" class="nav-item" data-target="feedbacks">
                <i class="ph ph-star"></i> Feedback & Reviews
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="top-header">
            <div class="header-title" id="header-title">User Management</div>
            <div class="header-actions">
                <button class="btn btn-primary" id="btn-add-new">
                    <i class="ph ph-plus"></i> Add New
                </button>
                <div class="user-profile">
                    <img src="https://ui-avatars.com/api/?name=Admin+User&background=0D8ABC&color=fff" alt="Admin">
                </div>
            </div>
        </header>

        <div class="content-body">
            <!-- Generic Data Table Container -->
            <div class="table-card glass-panel">
                <div class="table-header">
                    <div class="search-bar">
                        <i class="ph ph-magnifying-glass"></i>
                        <input type="text" id="search-input" placeholder="Search records...">
                    </div>
                </div>
                <div class="table-responsive">
                    <table id="data-table">
                        <thead id="table-head">
                        <!-- Dynamic Headers -->
                        </thead>
                        <tbody id="table-body">
                        <!-- Dynamic Rows -->
                        </tbody>
                    </table>
                </div>
                <div class="empty-state" id="empty-state" style="display: none;">
                    <i class="ph ph-folder-open"></i>
                    <p>No records found.</p>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Generic Modal for CRUD -->
<div class="modal-overlay" id="crud-modal">
    <div class="modal-content glass-panel">
        <div class="modal-header">
            <h3 id="modal-title">Add Record</h3>
            <button class="icon-btn" id="btn-close-modal">
                <i class="ph ph-x"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="crud-form">
                <div id="form-fields-container">
                    <!-- Dynamic Form Fields -->
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="btn-cancel-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btn-save-modal">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
